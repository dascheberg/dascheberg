<!DOCTYPE html>
<html lang="de">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ZahlenRaten</title>
	<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
	<link rel="stylesheet" href="css/styles.css">
</head>

<body>
	<a href="/spiele" id="zurueck-link">&#8592;
		Spiele</a>
	<div id="div1">
		<div id="titel">Rate eine Zahl - zwischen 1 und 100</div>
		<div id="zahlenstrahl-box">
			<div id="zahlenstrahl-beschriftung">
				<span>1</span>
				<span id="zahlenstrahl-bereich">Aktiver Bereich: 1 bis 100</span>
				<span>100</span>
			</div>
			<div id="zahlenstrahl">
				<div id="zahlenstrahl-skala"></div>
				<div id="zahlenstrahl-links" class="zahlenstrahl-aus"></div>
				<div id="zahlenstrahl-aktiv"></div>
				<div id="zahlenstrahl-rechts" class="zahlenstrahl-aus"></div>
				<div id="marker-min" class="zahlenstrahl-marker">1</div>
				<div id="marker-max" class="zahlenstrahl-marker">100</div>
				<div id="marker-tipp" class="zahlenstrahl-tipp verborgen"></div>
			</div>
		</div>

		<input type='text' id="eingabe" aria-label="Zahl eingeben">
		<div id="ausgabe"></div>
		<div id="versuche">0 Versuche</div>
		<div id="jubel" class="verborgen" aria-live="polite">
			<div id="jubel-text">Stark! Du hast die Zahl gefunden!</div>
			<div id="jubel-tier" aria-hidden="true">🐻👏</div>
		</div>
		<div id="startbutton">Neues Spiel</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
	<script src="js/main.js"></script>
</body>

</html>

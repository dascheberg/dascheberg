<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="controls">
  <button id="btnNeu" class="btn btn-neu">Neu</button>
  <button id="btnZiehen" class="btn btn-ziehen">Zahl ziehen</button>
  <button id="btnManuell" class="btn btn-manuell">Manuell</button>
  <button id="btnAbbruch" class="btn btn-abbruch">Abbruch</button>
  <button id="btnDoc" class="btn btn-doc">Hilfe</button>
  <button id="btnErklaerung" class="btn btn-erklaerung">Erklärung</button>
</header>

<main class="content">

  <section class="draw-display" id="drawDisplay">
    <div class="letter" id="currentLetter"></div>
    <div class="number" id="currentNumber"></div>
    <div class="mode-hint" id="modeHint"></div>
  </section>

  <aside class="board">
    <div class="board-row" data-letter="B">
      <span class="board-letter letter-B">B</span>
      <div class="board-numbers" id="row-B"></div>
    </div>
    <div class="board-row" data-letter="I">
      <span class="board-letter letter-I">I</span>
      <div class="board-numbers" id="row-I"></div>
    </div>
    <div class="board-row" data-letter="N">
      <span class="board-letter letter-N">N</span>
      <div class="board-numbers" id="row-N"></div>
    </div>
    <div class="board-row" data-letter="G">
      <span class="board-letter letter-G">G</span>
      <div class="board-numbers" id="row-G"></div>
    </div>
    <div class="board-row" data-letter="O">
      <span class="board-letter letter-O">O</span>
      <div class="board-numbers" id="row-O"></div>
    </div>

    <div class="board-info">
      <div class="info-line">Zuletzt gezogen: <span id="lastDrawn">–</span></div>
      <div class="info-line">Gezogene Zahlen: <span id="drawnCount">0</span> / 75</div>
    </div>
  </aside>

</main>

<div class="erklaerung-overlay" id="erklaerungOverlay" hidden>

  <button class="erklaerung-close" id="erklaerungClose" aria-label="Erklärung schließen">×</button>

  <h2 class="erklaerung-titel" id="erklaerungTitel"></h2>
  <p class="erklaerung-text" id="erklaerungText"></p>

  <div class="zettel">
    <div class="zettel-kopf">
      <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
    </div>
    <div class="zettel-feld">
      <div class="zettel-gitter" id="zettelGitter"></div>
      <div class="zettel-linien" id="zettelLinien" hidden></div>
    </div>
    <div class="zettel-nummer">Zettel Nr. 74</div>
  </div>

  <div class="erklaerung-legende" id="erklaerungLegende" hidden>
    <span class="legende-eintrag"><span class="legende-punkt farbe-waagerecht"></span>waagerecht</span>
    <span class="legende-eintrag"><span class="legende-punkt farbe-senkrecht"></span>senkrecht</span>
    <span class="legende-eintrag"><span class="legende-punkt farbe-diagonal1"></span><span class="legende-punkt farbe-diagonal2"></span>diagonal</span>
  </div>

  <p class="erklaerung-weiter" id="erklaerungWeiter"></p>

</div>

<script src="script.js"></script>
</body>
</html>
